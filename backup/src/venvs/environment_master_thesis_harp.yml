name: master_thesis_harp_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib=3.4
  - scipy=1.14
  - librosa
  - tqdm==4.65.0
  - shapely==2.0.7
  - compilers
  - libstdcxx-ng
  - libgcc-ng
  - ipython

  - portaudio
  - libsndfile

  - pip:
    - soundfile
    - spaudiopy
    - pyfar
    - sofar
    - spharpy
    - torch==2.0.1
    - datasets
    - pyroomacoustics==0.7.7
    - "pyshroom[dev]"
    - sounddevice